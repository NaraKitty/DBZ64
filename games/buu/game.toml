# ---------------------------------------------------------------- ROM cache
# 16KB ROM pages loaded into the N64 ROM cache at boot (host --rom-profile
# traces of the gameplay script and a 20000-frame attract run).  The cache
# here is the padding before .bss plus what the heap has left (see
# platform/n64/main.c): 1248 KB, 78 pages, with the current code size (it
# was 76 when this list was made).  The script alone touches 118 pages, so
# only the 52 pages field play uses most are pinned (most frames first),
# leaving a third of the cache to the LRU for scene changes.  In a
# simulation of a 76-page cache over those traces field play (from frame
# 7300) never misses; the story intro misses at its scene changes (75 pages
# in 19 frames).  Random field play can touch more pages than the cache
# holds (77 in the 16,500 frames after the intro of fuzz_field1), so pages
# evicted there come back as misses (12-14 in ares with 76 pages, at most 4
# of them first uses).
[rom]
preload = [
    18, 429, 493, 215, 200, 430, 28, 19, 426, 427, 327, 455, 346, 358, 255, 323,
    210, 201, 357, 240, 213, 204, 212, 219, 238, 211, 223, 224, 452, 182, 29, 21,
    26, 27, 174, 203, 183, 191, 193, 322, 324, 198, 166, 453, 454, 5, 22, 434,
    444, 446, 23, 456,
]
