func = "ws_m1_rect_l"
[[override_load]]
pc = 0x08012D0C
func = "ws_m1_rect_r"
[[override_load]]
pc = 0x08012D14
func = "ws_m1_rect_t"
[[override_load]]
pc = 0x08012D1A
func = "ws_m1_rect_b"
